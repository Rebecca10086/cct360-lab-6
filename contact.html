<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Bloom Café | Contact</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar md:navbar-expand bg-1 fg-2" aria-label="Main navigation">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Little Bloom Café</a>

      <button class="btn-icon navbar-toggler" type="button"
        data-bs-toggle="drawer" data-bs-target="#siteMenu"
        aria-controls="siteMenu" aria-expanded="false" aria-label="Open navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>

      <dialog class="drawer drawer-end" id="siteMenu" tabindex="-1"
        aria-labelledby="siteMenuTitle">
        <div class="drawer-header">
          <div class="drawer-title" id="siteMenuTitle">Navigation</div>
          <button class="btn-close" type="button"
            data-bs-dismiss="drawer" aria-label="Close navigation"></button>
        </div>

        <div class="drawer-body">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#menu">Menu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
            </li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>

  <main class="container my-5">
    <h1>Contact Little Bloom Café</h1>
    <p>Ask us about the menu, dietary options, or group visits.</p>

    <form action="contact.html" method="get" class="mt-4">
      <div class="row g-4">
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="firstName">First name</label>
            <input class="form-control" type="text" id="firstName"
              autocomplete="given-name" required>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="lastName">Last name</label>
            <input class="form-control" type="text" id="lastName"
              autocomplete="family-name" required>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email"
              autocomplete="email" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="topic">Topic</label>
            <select class="form-control" id="topic" required>
              <option value="" selected disabled>Choose a topic</option>
              <option value="menu">Menu question</option>
              <option value="dietary">Dietary options</option>
              <option value="group">Group visit</option>
              <option value="feedback">General feedback</option>
            </select>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label class="form-label" for="message">Message</label>
            <textarea class="form-control" id="message" rows="5" required></textarea>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <input class="check" type="checkbox" id="consent" required>
            <label for="consent">I agree to be contacted by email about my message.</label>
          </div>
        </div>
      </div>

      <button class="btn-solid theme-primary mt-4" type="submit">Submit</button>
    </form>
  </main>

  <footer class="theme-primary bg-2 fg-2 py-3">
    <div class="container">
      <p class="mb-0">&copy; 2026 Little Bloom Café</p>
    </div>
  </footer>
</body>
</html>
